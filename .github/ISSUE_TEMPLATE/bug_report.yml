name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: "Example: CLI --json output fails for fixture X."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Observe ...
        3. Expected ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS / environment
      placeholder: "Arch ISO, Arch Linux, Ubuntu CI, etc."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
    validations:
      required: false
